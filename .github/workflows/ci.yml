# CI green-gate — established by dz-runner setup mode.
# Runs the SAME `bin/check` a coding agent runs locally, so a green local run
# cannot land red here. Adjust the toolchain step below if the default runner
# image does not carry yours (e.g. actions/setup-node, oven-sh/setup-bun).
name: check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Through bash: a lost executable bit on a bin/ script reaches the gate as its finding, not "Permission denied".
      - run: bash bin/setup
      - run: bash bin/check
