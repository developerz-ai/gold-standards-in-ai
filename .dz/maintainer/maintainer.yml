# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy: developerz-ai/gold-standards-in-ai
#
# AI-maintained docs: the agent triages, answers, closes what has stalled and keeps links and claims
# accurate. Markdown only, so there is nothing to release — but CI runs `bin/check`, and its
# `check` result is the merge gate.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question, docs]
  close_unanswered_repro_after_days: 14
  stale_after_days: 30
  stale_action: comment_then_close
  non_goals:
    - "Code to build or tests to run: this repo is markdown only"
    - "Secrets, private hostnames or IPs, or client names"
    - "A doc not linked from README.md and its section README"
    - "Several topics in one file"
    - "Vendor-specific examples where a neutral one works"

handoff:
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit]
  # Named so the agent knows which red check is the author's to fix. Re-check against the
  # repo's ruleset and `.github/workflows/` when either changes; this list is not the ruleset.
  # `check` = the job name in `.github/workflows/ci.yml` (workflow `check`), which runs `bin/check`.
  # The merge gate matches the raw check-run name — never the UI's `check / check` label.
  # A red OR missing `check` result does not qualify a PR for auto-merge.
  required_checks: ["check"]
  auto_merge: true
  # Not `any`, unlike the code repos: an outside contributor's PR waits for a member. CI gates the
  # merge on `check`; coding agents read these docs as instructions, so the scope stays narrow.
  auto_merge_scope: own_and_dependency_bots
  require_review: true
  close_awaiting_author_after_days: 21

review:
  force: true # CodeRabbit is active here; without this the native review defers forever

release:
  # `none`: there is no release manager. Empty channels: the agent publishes nothing itself.
  # Nothing publishes from this repo.
  manager: none
  channels: []

escalate:
  # Empty: nothing beyond the platform's hardcoded asks (security, license, CLA).
  ask_before_acting: []

schedules:
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: improve
    days: [mon]
    hours_utc: [8]
    brief_file: .dz/briefs/improve.md
